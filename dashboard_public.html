<html lang="th">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สถานะห้องพัก · 2Be Home PD15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2438;
    --paper:#fbf7f2;
    --card-shadow: 0 2px 6px rgba(43,36,56,.12), 0 1px 2px rgba(43,36,56,.08);
    --amber:#f0a63a;
    --red:#e2543f;
    --line: rgba(43,36,56,.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(155,127,209,.10), transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(244,166,198,.12), transparent 40%);
    color:var(--ink);
    font-family:'Kanit', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  h1,h2,.num,.room-no,.tab, .brand{ font-family:'Space Grotesk','Kanit',sans-serif; }

  header{
    padding:22px 18px 14px;
    max-width:1100px;
    margin:0 auto;
  }
  .brand{
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#8b7fa8;
    font-weight:600;
    margin-bottom:4px;
  }
  h1{
    font-size:26px;
    margin:0 0 4px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .sub{
    font-size:13.5px;
    color:#6b6178;
    margin:0;
  }

  .viewToggle{
    display:flex;
    gap:6px;
    margin-top:16px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    width:fit-content;
  }
  .viewToggle button{
    border:none;
    background:transparent;
    padding:8px 16px;
    border-radius:999px;
    font-family:'Kanit',sans-serif;
    font-size:13.5px;
    font-weight:500;
    color:#6b6178;
    cursor:pointer;
    transition:.15s;
  }
  .viewToggle button.active{
    background:var(--ink);
    color:#fff;
  }

  .summary{
    max-width:1100px;
    margin:16px auto 0;
    padding:0 18px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:7px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 12px;
    font-size:12.5px;
    cursor:pointer;
    user-select:none;
    transition:.15s;
  }
  .chip:hover{ transform:translateY(-1px); box-shadow:var(--card-shadow); }
  .chip.dimmed{ opacity:.35; }
  .chip .dot{ width:11px; height:11px; border-radius:4px; border:1px solid rgba(0,0,0,.15); flex:none; }
  .chip .num{ font-weight:700; font-size:13.5px; }
  .chip .lbl{ color:#5a5166; }

  .floorTabs{
    max-width:1100px;
    margin:18px auto 0;
    padding:0 18px;
    display:flex;
    gap:8px;
    overflow-x:auto;
  }
  .tab{
    flex:none;
    width:46px; height:46px;
    border-radius:14px;
    border:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    font-weight:700;
    font-size:16px;
    color:#fff;
    opacity:.55;
    transition:.15s;
  }
  .tab span{ font-family:'Kanit',sans-serif; font-weight:400; font-size:8.5px; opacity:.85; }
  .tab.active{ opacity:1; transform:scale(1.06); box-shadow:var(--card-shadow); }

  main{
    max-width:1100px;
    margin:18px auto 0;
    padding:0 18px;
  }
  .wing{ margin-bottom:22px; }
  .wingLabel{
    font-size:11.5px;
    color:#8b7fa8;
    font-weight:600;
    letter-spacing:.06em;
    margin:0 0 8px 2px;
  }
  .roomGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  @media(min-width:640px){ .roomGrid{ grid-template-columns:repeat(5,1fr); } }
  @media(min-width:900px){ .roomGrid{ grid-template-columns:repeat(8,1fr); } }

  .card{
    position:relative;
    border-radius:13px;
    padding:10px 8px 16px;
    cursor:pointer;
    box-shadow:var(--card-shadow);
    border:1px solid rgba(0,0,0,.06);
    min-height:74px;
    display:flex; flex-direction:column; justify-content:space-between;
    transition:.12s;
    overflow:hidden;
  }
  .card:active{ transform:scale(.97); }
  .card .hole{
    position:absolute; top:6px; right:7px;
    width:8px; height:8px; border-radius:50%;
    background:rgba(255,255,255,.65);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  }
  .card .room-no{
    font-size:18px; font-weight:700; line-height:1;
  }
  .card .tenant{
    font-size:9.5px;
    color:rgba(43,36,56,.72);
    margin-top:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card .badges{
    position:absolute; top:6px; left:6px;
    display:flex; gap:3px;
  }
  .badges .b{
    width:7px; height:7px; border-radius:50%;
    border:1px solid rgba(255,255,255,.8);
  }
  .card .barcode{
    position:absolute; left:8px; right:8px; bottom:5px; height:6px;
    background-image: repeating-linear-gradient(90deg, rgba(43,36,56,.35) 0 1px, transparent 1px 3px);
    opacity:.5;
    border-radius:1px;
  }
  .card .cornerTag{
    position:absolute; bottom:5px; right:8px;
    font-size:7.5px; color:rgba(43,36,56,.4); font-weight:600;
  }

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:30px 10px;
    color:#8b7fa8;
    font-size:13px;
  }

  /* detail panel */
  .overlay{
    position:fixed; inset:0; background:rgba(43,36,56,.35);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .overlay.hidden{ display:none; }
  .panel{
    background:#fff;
    width:100%; max-width:480px;
    border-radius:20px 20px 0 0;
    padding:22px 22px 28px;
    box-shadow:0 -8px 30px rgba(0,0,0,.2);
    max-height:82vh; overflow-y:auto;
  }
  @media(min-width:640px){
    .overlay{ align-items:center; }
    .panel{ border-radius:20px; }
  }
  .panel .ptop{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .panel h2{ font-size:26px; margin:0; }
  .panel .statusPill{
    display:inline-block; padding:5px 12px; border-radius:999px;
    font-size:12px; font-weight:600; margin-top:2px;
  }
  .panel .close{
    border:none; background:#f1eef7; width:32px; height:32px; border-radius:50%;
    font-size:16px; cursor:pointer; color:#6b6178;
  }
  .rows{ margin-top:16px; display:flex; flex-direction:column; gap:11px; }
  .row{ display:flex; justify-content:space-between; gap:14px; font-size:13.5px; border-bottom:1px dashed var(--line); padding-bottom:9px; }
  .row .k{ color:#8b7fa8; flex:none; }
  .row .v{ text-align:right; font-weight:500; }
  .noteBox{ margin-top:14px; background:#f8f4fb; border-radius:12px; padding:12px 14px; font-size:13px; color:#4b3f5c; white-space:pre-line; }
  .expiryBanner{ margin-top:14px; border-radius:12px; padding:10px 14px; font-size:12.5px; font-weight:500; }

  .layoutToggle{
    display:flex;
    gap:6px;
    margin-top:10px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    width:fit-content;
  }
  .layoutToggle button{
    border:none;
    background:transparent;
    padding:7px 14px;
    border-radius:999px;
    font-family:'Kanit',sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:#6b6178;
    cursor:pointer;
    transition:.15s;
  }
  .layoutToggle button.active{
    background:#efe9f8;
    color:var(--ink);
  }

  .wbScroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:8px;
    border-radius:14px;
  }
  .wbGrid{
    display:grid;
    grid-template-columns: 58px repeat(20, 40px);
    gap:4px;
    width:max-content;
  }
  .wbWingHeader{
    font-size:9.5px;
    color:#8b7fa8;
    font-weight:600;
    letter-spacing:.03em;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:3px 2px 7px;
  }
  .wbFloorLabel{
    position:sticky; left:0; z-index:3;
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    border-radius:9px;
    color:#fff; font-weight:700; font-size:13px;
    font-family:'Space Grotesk',sans-serif;
  }
  .wbCell{
    border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:600;
    cursor:pointer;
    position:relative;
    min-height:36px;
    box-shadow:0 1px 2px rgba(43,36,56,.12);
    transition:.12s;
  }
  .wbCell.muted{ background:#efe9f8 !important; color:#b7abc9; cursor:default; box-shadow:none; }
  .wbCell.dimmed{ opacity:.3; }
  .wbCell:active{ transform:scale(.94); }
  .wbCell .wbDot{
    position:absolute; top:-3px; right:-3px;
    width:8px; height:8px; border-radius:50%;
    border:1.5px solid #fff;
  }
  .wbLegendNote{ font-size:11px; color:#a89dbb; margin:8px 2px 0; }

  footer{ max-width:1100px; margin:26px auto 0; padding:0 18px; font-size:11px; color:#a89dbb; }
</style>
</head>

  </div>

</header>

<div class="summary" id="summary"></div>

<nav class="floorTabs" id="floorTabs"></nav>

<footer>ข้อมูลจากไฟล์ "สรุปสถานะห้องพัก" — อัปเดตล่าสุดตามไฟล์ที่ได้รับ ไม่ใช่แบบเรียลไทม์</footer>

</div>

  function floorColorStrong(floor){

    return `hsl(${hue.toFixed(0)} 46% 52%)`;
  }

  // ---------- contract expiry calc (คำนวณจากวันที่จริงตอนเปิดหน้า) ----------
  function daysLeft(iso){
    if(!iso) return null;
    const end = new Date(iso + 'T00:00:00');
    const now = new Date();
    now.setHours(0,0,0,0);
    return Math.round((end - now) / 86400000);
  }
  function expiryTier(iso){
    const d = daysLeft(iso);
    if(d === null) return null;
    if(d < 0) return null; // หมดแล้ว ไม่แสดง badge (เคสพิเศษ ปกติควรอัปเดตสถานะห้อง)
    if(d <= URGENT_DAYS) return 'urgent';
    if(d <= WARN_DAYS) return 'warning';
    return null;
  }

  // ---------- customer-mode visibility ----------
  const CUSTOMER_STATUS = { moving_out: true, vacant: true };

  let mode = 'staff'; // staff | customer
  let layout = 'byFloor'; // byFloor | wholeBuilding
  let activeFloor = 8;
  let filterStatus = null;

  const floors = [8,7,6,5,4,3,2];
  const floorsAsc = [2,3,4,5,6,7,8]; // ลำดับเหมือนตาราง Excel ต้นฉบับ (ชั้น 2 บนสุด)
  const wingsOrder = ['ฝั่งหลังลิฟท์','ฝั่งทางเดินยาว','เห็นเซ็นทรัล'];
  const wingSpan = { 'ฝั่งหลังลิฟท์':[2,10], 'ฝั่งทางเดินยาว':[10,18], 'เห็นเซ็นทรัล':[18,22] };


  function roomsForFloor(floor){
    return rooms.filter(r => r.floor === floor).sort((a,b)=>a.col-b.col);
  }

  function renderTabs(){
    const el = document.getElementById('floorTabs');
    el.innerHTML = '';
    floors.forEach(f=>{
      const b = document.createElement('button');
      b.className = 'tab' + (f===activeFloor ? ' active':'');
      b.style.background = floorColorStrong(f);
      b.innerHTML = f + '<span>ชั้น</span>';
      b.onclick = ()=>{ activeFloor = f; render(); };
      el.appendChild(b);
    });
  }

  function renderSummary(){
    const el = document.getElementById('summary');
    el.innerHTML = '';
    const counts = {};
    rooms.forEach(r=>{ counts[r.status] = (counts[r.status]||0)+1; });
    Object.keys(statusMeta).forEach(key=>{
      if(!counts[key]) return;
      if(mode==='customer' && !CUSTOMER_STATUS[key]) return;
      const meta = statusMeta[key];
      const chip = document.createElement('div');
      chip.className = 'chip' + (filterStatus && filterStatus!==key ? ' dimmed':'');
      chip.innerHTML = `<span class="dot" style="background:${meta.swatch}"></span>
        <span class="num">${counts[key]}</span><span class="lbl">${meta.label}</span>`;
      chip.onclick = ()=>{ filterStatus = (filterStatus===key) ? null : key; render(); };
      el.appendChild(chip);
    });
    // contract expiry summary (staff only)
    if(mode==='staff'){
      const urgent = rooms.filter(r=>expiryTier(r.contractEndDate)==='urgent').length;
      const warn = rooms.filter(r=>expiryTier(r.contractEndDate)==='warning').length;
      if(urgent){
        const c = document.createElement('div');
        c.className='chip';
        c.innerHTML = `<span class="dot" style="background:${'#e2543f'}"></span><span class="num">${urgent}</span><span class="lbl">สัญญาเหลือ ≤${URGENT_DAYS} วัน</span>`;
        el.appendChild(c);
      }
      if(warn){
        const c = document.createElement('div');
        c.className='chip';
        c.innerHTML = `<span class="dot" style="background:${'#f0a63a'}"></span><span class="num">${warn}</span><span class="lbl">สัญญาเหลือ ≤${WARN_DAYS} วัน</span>`;
        el.appendChild(c);
      }
    }
  }

  function cardEl(r){
    const meta = statusMeta[r.status] || statusMeta.unknown;
    if(mode==='customer' && !CUSTOMER_STATUS[r.status]) return null;
    if(filterStatus && r.status!==filterStatus) return null;

    const card = document.createElement('div');
    card.className = 'card';
    card.style.background = meta.swatch;
    if(r.status==='moving_out'){ card.style.border = '1.5px solid rgba(43,36,56,.18)'; }

    const tier = expiryTier(r.contractEndDate);
    let badges = '';
    if(mode==='staff'){
      if(tier==='urgent') badges += `<span class="b" style="background:${'#e2543f'}"></span>`;
      else if(tier==='warning') badges += `<span class="b" style="background:${'#f0a63a'}"></span>`;
      if(r.fontFlag==='purple_text') badges += `<span class="b" style="background:#7030A0" title="รอตรวจสอบความหมาย"></span>`;
    }

    card.innerHTML = `
      <div class="hole"></div>
      ${badges ? `<div class="badges">${badges}</div>` : ''}
      <div class="room-no">${r.room}</div>
      ${(mode==='staff' && r.tenantName) ? `<div class="tenant">${r.tenantName}</div>` : ''}
      <div class="barcode"></div>
      ${r.corner ? `<div class="cornerTag">มุม</div>` : ''}
    `;
    card.onclick = ()=> openDetail(r);
    return card;
  }

  function render(){
    document.getElementById('btnStaff').classList.toggle('active', mode==='staff');
    document.getElementById('btnCustomer').classList.toggle('active', mode==='customer');
    document.getElementById('btnByFloor').classList.toggle('active', layout==='byFloor');
    document.getElementById('btnWholeBuilding').classList.toggle('active', layout==='wholeBuilding');
    renderSummary();

    const floorTabsEl = document.getElementById('floorTabs');
    const main = document.getElementById('floorContent');
    main.innerHTML = '';

    if(layout==='byFloor'){
      floorTabsEl.style.display = 'flex';
      renderTabs();

      const floorRooms = roomsForFloor(activeFloor);
      let anyShown = false;
      wingsOrder.forEach(wing=>{
        const list = floorRooms.filter(r=>r.wing===wing);
        const cards = list.map(cardEl).filter(Boolean);
        if(cards.length===0) return;
        anyShown = true;
        const wingDiv = document.createElement('div');
        wingDiv.className = 'wing';
        const label = document.createElement('div');
        label.className = 'wingLabel';
        label.textContent = wing + ' · ชั้น ' + activeFloor;
        wingDiv.appendChild(label);
        const grid = document.createElement('div');
        grid.className = 'roomGrid';
        cards.forEach(c=>grid.appendChild(c));
        wingDiv.appendChild(grid);
        main.appendChild(wingDiv);
      });
      if(!anyShown){
        main.innerHTML = '<div class="empty">ไม่มีห้องที่ตรงเงื่อนไขในชั้นนี้</div>';
      }
    } else {
      floorTabsEl.style.display = 'none';
      renderWholeBuilding(main);
    }
  }

  function isVisible(r){
    if(mode==='customer' && !CUSTOMER_STATUS[r.status]) return false;
    return true;
  }

  function renderWholeBuilding(main){
    const wrap = document.createElement('div');
    wrap.className = 'wbScroll';
    const grid = document.createElement('div');
    grid.className = 'wbGrid';

    // แถวหัวตาราง: ป้ายฝั่ง (เหมือนแถว 13 ในไฟล์ Excel ต้นฉบับ)
    const cornerLabel = document.createElement('div');
    grid.appendChild(cornerLabel);
    wingsOrder.forEach(wing=>{
      const h = document.createElement('div');
      h.className = 'wbWingHeader';
      h.textContent = wing;
      h.style.gridColumn = wingSpan[wing][0] + ' / ' + wingSpan[wing][1];
      grid.appendChild(h);
    });

    floorsAsc.forEach(floor=>{
      const label = document.createElement('div');
      label.className = 'wbFloorLabel';
      label.textContent = floor;
      label.style.background = floorColorStrong(floor);
      label.style.gridRow = 'auto';
      grid.appendChild(label);

      const floorRooms = roomsForFloor(floor);
      for(let col=1; col<=20; col++){
        const r = floorRooms.find(x=>x.col===col);
        const cell = document.createElement('div');
        cell.className = 'wbCell';
        cell.style.gridColumn = (col+1);
        if(!r){
          cell.classList.add('muted');
          grid.appendChild(cell);
          continue;
        }
        const meta = statusMeta[r.status] || statusMeta.unknown;
        const visible = isVisible(r);
        if(!visible){
          cell.classList.add('muted');
          cell.textContent = r.room.slice(-2);
        } else {
          cell.style.background = meta.swatch;
          if(r.status==='moving_out'){ cell.style.border = '1.5px solid rgba(43,36,56,.2)'; }
          cell.textContent = r.room.slice(-2);
          if(filterStatus && r.status!==filterStatus) cell.classList.add('dimmed');
          if(mode==='staff'){
            const tier = expiryTier(r.contractEndDate);
            if(tier){
              const dot = document.createElement('div');
              dot.className = 'wbDot';
              dot.style.background = tier==='urgent' ? '#e2543f' : '#f0a63a';
              cell.appendChild(dot);
            }
          }
          cell.onclick = ()=> openDetail(r);
        }
        grid.appendChild(cell);
      }
    });

    wrap.appendChild(grid);
    main.appendChild(wrap);
    const note = document.createElement('div');
    note.className = 'wbLegendNote';
    note.textContent = 'เลื่อนซ้าย-ขวาเพื่อดูห้องทั้งหมด · เลขในช่องคือ 2 ตัวท้ายของเลขห้อง (เช่น 815 = 15)';
    main.appendChild(note);
  }

  function fmtMoney(n){
    if(n===null || n===undefined || n==='') return '-';
    return Number(n).toLocaleString('th-TH') + ' บาท';
  }

  function openDetail(r){
    const meta = statusMeta[r.status] || statusMeta.unknown;

    document.getElementById('pRoom').textContent = 'ห้อง ' + r.room;
    const pill = document.getElementById('pStatusPill');
    pill.textContent = meta.label;
    pill.style.background = meta.swatch;

    const tier = expiryTier(r.contractEndDate);
    const expiryEl = document.getElementById('pExpiry');
    expiryEl.innerHTML = '';
    if(tier){
      const d = daysLeft(r.contractEndDate);
      const div = document.createElement('div');
      div.className = 'expiryBanner';
      div.style.background = tier==='urgent' ? '#fde8e4' : '#fdf1de';
      div.style.color = tier==='urgent' ? '#a8362a' : '#8a5a12';
      div.textContent = `สัญญาใกล้หมด — เหลืออีก ${d} วัน (สิ้นสุด ${r.contractEndDate})`;
      expiryEl.appendChild(div);
    }

    const rowsData = (mode==='staff') ? [
      !PUBLIC_BUILD && ['ผู้เช่า', r.tenantName || '-'],
      !PUBLIC_BUILD && ['เบอร์โทร', r.phone || '-'],
      ['ประเภทห้อง', r.roomType || '-'],
      !PUBLIC_BUILD && ['ค่าเช่า', fmtMoney(r.price)],
      !PUBLIC_BUILD && ['ค่าส่วนกลาง', fmtMoney(r.commonFee)],
      ['วันสิ้นสุดสัญญา', r.contractEndDate || '-'],
      ['ฝั่ง', r.wing],
    ].filter(Boolean) : [
      ['ฝั่ง', r.wing],
      ['ชั้น', r.floor],
    ];

    const rowsEl = document.getElementById('pRows');
    rowsEl.innerHTML = '';
    rowsData.forEach(([k,v])=>{
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="k">${k}</span><span class="v">${v}</span>`;
      rowsEl.appendChild(row);
    });

    const noteWrap = document.getElementById('pNoteWrap');
    noteWrap.innerHTML = '';
    if(mode==='staff' && (r.note || r.tenantNote)){
      const box = document.createElement('div');
      box.className = 'noteBox';
      box.textContent = [r.note, r.tenantNote].filter(Boolean).join('\\n');
      noteWrap.appendChild(box);
    }

    document.getElementById('overlay').classList.remove('hidden');
  }

  document.getElementById('pClose').onclick = ()=> document.getElementById('overlay').classList.add('hidden');
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') e.currentTarget.classList.add('hidden'); };

  document.getElementById('btnStaff').onclick = ()=>{ mode='staff'; filterStatus=null; render(); };
  document.getElementById('btnCustomer').onclick = ()=>{ mode='customer'; filterStatus=null; render(); };
  document.getElementById('btnByFloor').onclick = ()=>{ layout='byFloor'; render(); };
  document.getElementById('btnWholeBuilding').onclick = ()=>{ layout='wholeBuilding'; render(); };

  render();
})();
</script>
</body>
</html>
